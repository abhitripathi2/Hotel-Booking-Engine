spring.application.name=hotel-booking-backend


#DB configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/airbnb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.servlet.context-path=/api/v1

jwt.secret.key=${JWT_SECRET}

frontend.url=http://localhost:8080

stripe.secret.key=${STRIPE_SECRET_KEY}

#run this command to generate a webhook secret key through CMD: stripe listen --forward-to localhost:8080/api/v1/webhook/payment --all-snapshot
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}